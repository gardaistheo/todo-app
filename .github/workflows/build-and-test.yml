name: Build and Test Frontend

on:
  push:
    branches:
      - devlop
  pull_request:
    branches:
      - devlop

jobs:
  frontend-build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install
        working-directory: ./frontend

      - name: Run tests
        run: npm test
        working-directory: ./frontend

      - name: Build app
        run: npm run build
        working-directory: ./frontend
