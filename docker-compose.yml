version: '3'

services:
  # Service MongoDB
  mongodb:
    image: mongo:latest
    container_name: todo-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - todo-app-network

  # Service Backend
  backend:
    build: ./backend
    container_name: todo-backend
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/todoapp
      - PORT=5000
    networks:
      - todo-app-network

  # Service Frontend
  frontend:
    build: ./frontend
    container_name: todo-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
    networks:
      - todo-app-network

networks:
  todo-app-network:
    driver: bridge

volumes:
  mongodb_data: